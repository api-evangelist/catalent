description: >-
  Catalent is a global pharmaceutical contract development and manufacturing organization (CDMO)
  headquartered in Somerset, New Jersey, and owned by Novo Holdings since December 2024. It
  develops, manufactures and supplies medicines and consumer health products for biopharma,
  biotech and self-care brands across biologics, cell and gene therapy, oral and injectable dose
  forms, clinical supply and consumer health, from roughly forty facilities. Catalent has no
  developer program: it publishes no API, OpenAPI, SDK, package, MCP server or agent card, and the
  developer.catalent.com and api.catalent.com hosts an earlier catalog record assumed do not exist
  in DNS. Its only customer-facing software surface is the OneHub clinical-supply portal, a
  login-gated Salesforce Experience Cloud site. It does publish a first-party llms.txt index of
  its corporate site and a working privacy-request form; both are captured here, and nothing has
  been authored on its behalf.
